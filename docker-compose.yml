services:
  db:
    image: postgres:16-alpine
    container_name: park-dostavka-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: park_dostavka_development
    ports:
      - "5434:5432"
    volumes:
      - park_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: ruby:3.4-bookworm
    container_name: park-dostavka-web
    working_dir: /app
    command: bash -lc "bundle install && bundle exec rails db:prepare db:seed && bundle exec rails server -b 0.0.0.0 -p 3000"
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://postgres:postgres@db:5432/park_dostavka_development
      PGUSER: postgres
      PGPASSWORD: postgres
      PGHOST: db
      PGPORT: "5432"
      BUNDLE_PATH: /usr/local/bundle
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - park_bundle:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy

volumes:
  park_pg_data:
  park_bundle:
